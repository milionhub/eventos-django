# Install once: `cd backend && uv run pre-commit install` (hooks then run on every commit).
# Run manually: `cd backend && uv run pre-commit run --all-files`.
# ruff and prettier are "local" hooks so they use the versions pinned in uv.lock and
# package-lock.json instead of a second, independently versioned copy.

# Generated code is never touched by hooks (it must match the generator's output byte for byte).
exclude: ^(backend/schema\.yml|frontend/src/app/core/api/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig allows comments
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: prettier
        name: prettier
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: ^frontend/src/.*\.(ts|html|scss)$

  /api/v1/organizations/{org_slug}/:
    get:
      operationId: organizations_retrieve
      description: |-
        For views under `organizations/<org_slug>/...` (RN-06).

        Resolves the organization from the URL through the user's own memberships, so an
        organization the user does not belong to is indistinguishable from one that does
        not exist: 404. A member whose role is not enough for the method gets 403.

        Views declare who may call each method:

            roles_by_method = {"GET": ALL_ROLES, "PATCH": {Role.OWNER}}

        and then use `self.organization` / `self.membership`, filtering every queryset by
        `self.organization`.
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganization'
          description: ''
    patch:
      operationId: organizations_update
      description: |-
        For views under `organizations/<org_slug>/...` (RN-06).

        Resolves the organization from the URL through the user's own memberships, so an
        organization the user does not belong to is indistinguishable from one that does
        not exist: 404. A member whose role is not enough for the method gets 403.

        Views declare who may call each method:

            roles_by_method = {"GET": ALL_ROLES, "PATCH": {Role.OWNER}}

        and then use `self.organization` / `self.membership`, filtering every queryset by
        `self.organization`.
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganization'
          description: ''
  /api/v1/organizations/{org_slug}/events/:
    get:
      operationId: events_list
      description: 'Adds `get_event()`: the event from the URL, only within what the
        caller may see.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - DRAFT
          - PUBLISHED
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      description: 'Adds `get_event()`: the event from the URL, only within what the
        caller may see.'
      parameters:
      - in: path
        name: org_slug
        schema:
          type: string
        required: true
      tags:
      - events

openapi: 3.0.3
info:
  title: eventos-django API
  version: 1.0.0
  description: Gestión de eventos, reservas y entradas QR.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: ''
  /api/v1/auth/refresh/:

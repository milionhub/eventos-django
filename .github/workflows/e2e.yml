name: e2e

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/e2e.yml"]
  workflow_dispatch: # manual run from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventos_e2e
          POSTGRES_USER: eventos
          POSTGRES_PASSWORD: eventos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventos -d eventos_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Read by e2e/backend.mjs, which starts Django on port 8001 for the tests.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      E2E_DATABASE_URL: postgres://eventos:eventos@localhost:5432/eventos_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The 5 journeys (requirements.md §2) on a desktop and on a phone, against the
      # production build. playwright.config.ts starts both servers.
      - name: Run end-to-end tests
        run: npm run e2e

      # On failure: the HTML report with a trace per failed test (npx playwright show-trace).
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

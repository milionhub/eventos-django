name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/schema.yml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/schema.yml", ".github/workflows/frontend.yml"]
  workflow_dispatch: # manual run from the Actions tab
  schedule:
    - cron: "0 6 * * 1" # Mondays: catches new advisories even without pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in package-lock.json; high and critical ones fail the build.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # ADR-0007: the committed client must match the committed schema.
      - name: Check API client is up to date
        run: |
          npm run api:client
          if [ -n "$(git status --porcelain src/app/core/api)" ]; then
            git status --porcelain src/app/core/api
            echo "::error::The API client is outdated. Run 'npm run api:generate' and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

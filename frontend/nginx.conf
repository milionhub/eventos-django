# The Django admin has its own login form, outside the API's rate limits.
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

# One origin for the browser, as in development: no CORS, and the refresh cookie just works.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Images are limited to 5 MB by the API; this leaves room for the multipart overhead.
    client_max_body_size 6m;

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/proxy.conf;
    }

    location ~ ^/(api|admin)/ {
        include snippets/proxy.conf;
    }

    # What the Django admin needs, gathered by collectstatic.
    location /static/ {
        alias /srv/static/;
        expires 7d;
        include snippets/security.conf;
    }

    # Uploaded images, re-encoded by the API (ADR-0008). Never run as anything but an image.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        include snippets/security.conf;
    }

    # The service worker decides when the app updates, so these must always be fresh.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        include snippets/security.conf;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        include snippets/security.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/security.conf;
    }

    # Everything else: a file of the build, or the Angular app for its own routes.
    location / {
        try_files $uri /index.html;
        include snippets/security.conf;
    }
}

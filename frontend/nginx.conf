# One origin for the browser, as in development: no CORS, and the refresh cookie just works.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Images are limited to 5 MB by the API; this leaves room for the multipart overhead.
    client_max_body_size 6m;

    location ~ ^/(api|admin)/ {
        proxy_pass http://demo-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # What the Django admin needs, gathered by collectstatic.
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Uploaded images, re-encoded by the API (ADR-0008). Never run as anything but an image.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # The service worker decides when the app updates, so these must always be fresh.
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location = /ngsw.json { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Everything else: a file of the build, or the Angular app for its own routes.
    location / {
        try_files $uri /index.html;
    }
}

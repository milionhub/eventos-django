<mat-sidenav-container class="container">
  <mat-sidenav #drawer mode="over" [opened]="false" [disableClose]="false">
    <nav class="drawer-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="drawer.close()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <a class="brand" routerLink="/" aria-label="#4events, inicio">
        <span class="hash" aria-hidden="true">#</span><span aria-hidden="true">4events</span>
      </a>

      @if (!isHandset()) {
        <nav class="desktop-nav" aria-label="Navegación principal">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >{{ item.label }}</a
            >
          }
        </nav>
      }

      <span class="spacer"></span>

      <button
        mat-icon-button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </header>

    <main class="main">
      <router-outlet />
    </main>

    <footer class="footer">
      <span><span class="hash">#</span>4events</span>
      <span>Proyecto de portfolio · Django + Angular</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>

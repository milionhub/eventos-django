# Headers of everything nginx serves itself. A file to include because nginx drops inherited
# add_header directives in any location that declares its own.
#
# No inline scripts allowed. Styles do need 'unsafe-inline': Angular and Material write them
# into the page at run time. blob: is for the QR and the image preview; camera=(self) is what
# the door scanner needs. connect-src lists the fonts because the service worker fetches them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
